[build]
  # site/index.html is generated by scripts/build_site.py and committed, so there
  # is nothing to compile here. Without this publish setting Netlify serves the
  # repo root and every request 404s.
  publish = "site"
  command = "echo 'Static site is prebuilt by scripts/build_site.py'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The id -> {name, website} index the enrichment function validates against.
  # Written by build_site.py alongside site/index.html.
  included_files = ["data/companies.json"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
